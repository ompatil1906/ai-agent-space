name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  backend-check:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI backend startup
        working-directory: backend
        env:
          PROJECT_NAME: "AI Agent Space Test"
          SECRET_KEY: "ci-test-secret-key-32bytes-ci"
          DATABASE_URL: "sqlite:///./ci_test.db"
          OPENAI_API_KEY: "test-key"
          CORS_ORIGINS: "*"
        run: |
          python -c "import app.main; print('✓ FastAPI backend loaded and verified successfully!')"
